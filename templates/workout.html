<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Workout</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <h1>My Workout</h1>
        <p>Create your own workout</p>
    </header>

    <main>

        <a href="{{ url_for('home') }}">← Back to Muscle Groups</a>

        <h2>Choose Your Exercises</h2>

        <div class="exercise-list">

            {% for exercise in exercises %}

            <div class="exercise">

                <h3>{{ exercise["name"] }}</h3>

                <p>
                    <strong>Muscle:</strong>
                    {{ exercise["primary_muscle"] }}
                </p>

                    <form action="{{ url_for('add_to_workout', exercise_id=exercise['id']) }}" method="POST">
                             <button type="submit">
                            Add to My Workout
                        </button>
                    </form>

            </div>

            {% endfor %}

        </div>

    </main>

</body>

</html>
